[package]
name = "git-workflow"
version = "0.4.0"
edition = "2024"
authors = ["zawakin"]
description = "Git guardrails for AI coding agents - safe git workflows with clear state feedback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lanegrid/git-workflow"
homepage = "https://github.com/lanegrid/git-workflow"
documentation = "https://docs.rs/git-workflow"
readme = "README.md"
keywords = ["git", "workflow", "cli", "worktree", "github"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[[bin]]
name = "git-workflow"
path = "src/main.rs"

[[bin]]
name = "gw"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
thiserror = "1.0"

[dev-dependencies]
regex = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
